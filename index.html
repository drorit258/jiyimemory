function renderSummary(){const start=addDays(TODAY,1-summaryRange),all=state.tasks.filter(t=>t.date>=start&&t.date<=TODAY),done=all.filter(t=>t.done),percent=all.length?Math.round(done.length/all.length*100):0,overdue=state.tasks.filter(t=>!t.done&&t.date<TODAY).length,days=new Set(state.tasks.filter(t=>t.done&&(t.completedDate||t.date)>=start&&(t.completedDate||t.date)<=TODAY).map(t=>t.completedDate||t.date)).size;const bucketCount=summaryRange===7?7:10,bucketSize=summaryRange===7?1:3,buckets=Array.from({length:bucketCount},(_,i)=>{const from=addDays(start,i*bucketSize),to=addDays(from,bucketSize-1),ts=all.filter(t=>t.date>=from&&t.date<=to);return {from,to,done:ts.filter(t=>t.done).length,pending:ts.filter(t=>!t.done).length};}),max=Math.max(1,...buckets.map(b=>b.done+b.pending));return `${pageHead('你走过的路，<span class="soft">都看得见。</span>','完成的每一小步，正在成为更清晰的自己。',`<div class="segmented summary-range">${[7,30].map(n=>`<button data-action="summary-range" data-range="${n}" class="${summaryRange===n?'selected':''}">近 ${n} 天</button>`).join('')}</div>`)}<div class="metrics">${[['已完成任务',done.length,'项','today','每一次复习，都让记忆更稳固'],['待完成任务',all.length-done.length,'项','flag',`其中 ${overdue} 项已逾期，可智能调整`],['任务完成率',percent,'%','chart',`统计最近 ${summaryRange} 天到期任务`],['学习天数',days,'天','flame',`近 ${summaryRange} 天有打卡的日子`]].map(([n,v,u,ic,tip])=>`<div class="metric"><div class="metric-top">${n}<span class="metric-icon">${icon(ic)}</span></div><div class="metric-number">${v}<small>${u}</small></div><div class="metric-foot">${tip}</div></div>`).join('')}</div><div class="summary-grid"><section class="panel chart-panel"><h3>每天一点点，积累看得见</h3><p>按计划日期统计已完成与待完成的任务</p><div class="bar-chart" role="img" aria-label="近${summaryRange}天完成任务${done.length}项，未完成${all.length-done.length}项">${buckets.map(b=>`<div class="bar-column" title="${pretty(b.from)}${bucketSize>1?'–'+pretty(b.to):''}：完成 ${b.done}，待完成 ${b.pending}"><span class="bar-value">${b.done+b.pending||''}</span><div class="bar-stack" style="heig function closeModal(){for(const url of objectURLs)URL.revokeObjectURL(url);objectURLs=[];$('#modal-root').innerHTML='';document.body.style.overflow='';modalType=null;modalContext=null;draft=null;lastFocus?.focus?.({preventScroll:true});}
function showConfirm(title,text,onConfirm,label='确认删除'){showModal(title,`<p class="modal-description">${text}</p>`,btn('取消','close-modal')+btn(label,'confirm-action','','btn-danger'),'small-modal');modalType='confirm';modalContext={onConfirm};}
function newDraftRow(file=null){const pdf=file?.name.toLowerCase().endsWith('.pdf');return {key:uid(),file,title:file?file.name.replace(/\.[^.]+$/,''):'',unit:pdf?'页':'章',total:pdf?100:10,firstBatch:1,dailyBatch:1,text:'',minutes:15};}
function openImport(){draft={tab:'files',rows:[],startDate:TODAY,weekRest:[],extraRest:[],error:''};renderImport();modalType='import';}
function syncDraft(){if(!draft)return;for(const row of draft.rows){for(const name of ['title','unit','total','firstBatch','dailyBatch','text','minutes']){const el=$(`[data-row="${row.key}"][data-field="${name}"]`);if(el)row[name]=['total','firstBatch','dailyBatch','minutes'].includes(name)?Number(el.value):el.value;}}const start=$('#import-start');if(start)draft.startDate=start.value;}

function renderImport(){
  const rowHTML=r=>`<div class="file-config"><div class="file-config-head">${icon('file')}<input data-row="${r.key}" data-field="title" aria-label="资料名称" placeholder="为这份资料起个名字" value="${esc(r.title)}" maxlength="100"><span class="import-file-type">${r.file?esc(r.file.name.split('.').pop().toUpperCase()):'手动资料'}</span><button class="btn btn-quiet" data-action="remove-import-row" data-key="${r.key}" aria-label="移除这份资料">${icon('close')}</button></div><div class="form-grid four"><label class="field">背诵单位<select data-row="${r.key}" data-field="unit">${['章','页','节','组'].map(u=>`<option ${r.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field">资料总量<input type="number" min="1" max="10000" step="1" data-row="${r.key}" data-field="total" value="${r.total}"></label><label class="field">第一天学习量<input type="number" min="1" step="1" data-row="${r.key}" data-field="firstBatch" value="${r.firstBatch}"></label><label class="field">之后每天学习量<input type="number" min="1" step="1" data-row="${r.key}" data-field="dailyBatch" value="${r.dailyBatch}"></label></div>${!r.file?`<label class="field" style="margin-top:13px">背诵内容或资料备注<textarea data-row="${r.key}" data-field="text" placeholder="粘贴需要记忆的内容，也可以填写纸质书的章节说明…">${esc(r.text)}</textarea></label>`:`<p class="form-scroll-note">请填写实际${r.unit==='页'?'页数':'章节或分组总量'}。原文件将保存在此浏览器中，学习时可打开查看。</p>`}</div>`;

async function addFiles(files){syncDraft();let error='';for(const file of files){if(!/\.(pdf|txt|md|markdown)$/i.test(file.name)){error='暂支持 PDF、TXT 和 Markdown 文件';continue;}if(file.size>10*1024*1024){error='每份资料不能超过 10 MB';continue;}if(draft.rows.length>=12){error='每次最多导入 12 份资料';break;}const row=newDraftRow(file);if(!/\.pdf$/i.test(file.name)){try{const text=await file.text();const sections=text.split(/(?=^#{1,6}\s+)|(?=^第[^\n]{1,15}[章节])/m).filter(t=>t.trim());if(sections.length>1)row.total=Math.min(sections.length,10000);}catch{}}draft.rows.push(row);}draft.error=error;renderImport();}
async function submitImport(){syncDraft();try{
    if(!draft.rows.length)throw Error('请先选择文件，或切换到手动创建');
    if(draft.startDate<TODAY)throw Error('请选择今天或之后的开始日期');
    const mats=draft.rows.map((r,i)=>validateMaterial({id:uid(),title:r.title.trim().slice(0,100),unit:r.unit,total:r.total,firstBatch:r.firstBatch,dailyBatch:r.dailyBatch,startDate:draft.startDate,weekRest:[...draft.weekRest],extraRest:[...draft.extraRest],color:COLORS[(state.materials.length+i)%COLORS.length],isDemo:false,filename:r.file?.name||r.title+'.txt',format:r.file?r.file.name.split('.').pop().toUpperCase():'手动',minutes:15}));
    const generated=mats.flatMap(generatePlan);if(state.tasks.length+generated.length>70000)throw Error('任务量较多，请分批导入或适当增加每日学习量');
    const button=$('[data-action="submit-import"]');button.disabled=true;button.textContent='正在保存资料…';
    const saved=[];try{for(let i=0;i<mats.length;i++){const r=draft.rows[i],blob=r.file||new Blob([r.text||'这是一份纸质资料。请对照你的原书，按计划完成当天的学习。'],{type:'text/plain'});await fileOp('readwrite',mats[i].id,blob);saved.push(mats[i].id);}}catch(e){for(const id of saved)await fileOp('readwrite',id).catch(()=>{});throw e;}
    const previous=JSON.stringify(state);state.materials.push(...mats);state.tasks.push(...generated);if(!save()){state=JSON.parse(previous);for(const id of saved)await fileOp('readwrite',id).catch(()=>{});throw Error('学习计划未保存，请减少资料数量后重试');}
    closeModal();selectedDay=TODAY;weekAnchor=TODAY;view='materials';render();toast(`已为 ${mats.length} 份资料生成独立的学习与复习计划`);
  }catch(e){if(draft){draft.error=e.message;const el=$('#import-error');if(el)el.textContent=e.message;const b=$('[data-action="submit-import"]');if(b){b.disabled=false;b.innerHTML=icon('spark')+'生成我的计划';}}}
}

    case 'delete-material':{const m=material(id);showConfirm('删除这份资料？',`“${esc(m.title)}”及其所有计划、打卡记录和原文件都将移除。`,()=>removeMaterials([id]));break;}
    case 'remove-demos':showConfirm('移除示例，开始自己的计划', '将删除示例资料及示例打卡记录。你自己导入的资料和学习进度会保留。',()=>removeMaterials(state.materials.filter(m=>m.isDemo).map(m=>m.id)),'移除示例');break;
    case 'clear-space':showConfirm('清空当前学习空间？','所有资料、计划与打卡记录都将从此浏览器移除。建议先导出完整备份。',()=>{state.celebrated=[];return removeMaterials(state.materials.map(m=>m.id));},'清空学习空间');break;
    case 'confirm-action':{const fn=modalContext?.onConfirm;trigger.disabled=true;trigger.textContent='正在处理…';try{await fn?.();}catch(e){trigger.disabled=false;toast(e.message);}break;}
    case 'toggle-celebration':state.settings.celebrate=!state.settings.celebrate;save();render();break;
    case 'export':await exportBackup();break;
    case 'restore':$('#backup-input').click();break;
    case 'import-tab':{syncDraft();draft.tab=trigger.dataset.tab;if(draft.tab==='manual'&&!draft.rows.length)draft.rows.push(newDraftRow());renderImport();break;}
    case 'add-manual':syncDraft();if(draft.rows.length>=12){toast('每次最多导入 12 份资料');break;}draft.rows.push(newDraftRow());renderImport();break;
    case 'remove-import-row':syncDraft();draft.rows=draft.rows.filter(r=>r.key!==trigger.dataset.key);renderImport();break;
    case 'import-rest':{syncDraft();const n=Number(trigger.dataset.day);if(!draft.weekRest.includes(n)&&draft.weekRest.length>=6){toast('每周至少保留一天学习');break;}draft.weekRest=draft.weekRest.includes(n)?draft.weekRest.filter(x=>x!==n):[...draft.weekRest,n];renderImport();break;}
    case 'import-add-rest':{syncDraft();const day=$('#import-extra').value;if(!day||day<TODAY){toast('请选择今天或之后的日期');break;}if(!draft.extraRest.includes(day))draft.extraRest.push(day);draft.extraRest.sort();renderImport();break;}
    case 'import-remove-rest':syncDraft();draft.extraRest=draft.extraRest.filter(d=>d!==trigger.dataset.day);renderImport();break;
    case 'submit-import':await submitImport();break;
    case 'edit-rest':{syncEdit();const n=Number(trigger.dataset.day);if(!editDraft.weekRest.includes(n)&&editDraft.weekRest.length>=6){toast('每周至少保留一天学习');break;}editDraft.weekRest=editDraft.weekRest.includes(n)?editDraft.weekRest.filter(x=>x!==n):[...editDraft.weekRest,n];try{validateEdit();renderEditPlan();}catch(e){$('#edit-error').textContent=e.message;}break;}
    case 'edit-add-rest':{syncEdit();const day=$('#edit-extra').value;if(!day||day<TODAY){toast('请选择今天或之后的日期');break;}if(!editDraft.extraRest.includes(day))editDraft.extraRest.push(day);try{validateEdit();renderEditPlan();}catch(e){$('#edit-error').textContent=e.message;}break;}
    case 'edit-remove-rest':syncEdit();editDraft.extraRest=editDraft.extraRest.filter(d=>d!==trigger.dataset.day);try{validateEdit();renderEditPlan();}catch(e){$('#edit-error').textContent=e.message;}break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='material-search'){const pos=e.target.selectionStart;searchTerm=e.target.value;render();const field=$('#material-search');field.focus();field.setSelectionRange?.(pos,pos);}});
document.addEventListener('change',async e=>{if(e.target.id==='material-files')await addFiles([...e.target.files]);if(e.target.id==='plan-material-filter'){materialFilter=e.target.value;render();}if(e.target.id==='backup-input'){await readBackup(e.target.files[0]);e.target.value='';}if(e.target.id==='reattach-file'){const file=e.target.files[0];if(!file)return;try{if(!/\.(pdf|txt|md|markdown)$/i.test(file.name))throw Error('请选择 PDF、TXT 或 Markdown 文件');if(file.size>10*1024*1024)throw Error('原文件不能超过 10 MB');const m=material(e.target.dataset.id);await fileOp('readwrite',m.id,file);m.format=file.name.split('.').pop().toUpperCase();m.filename=file.name;save();closeModal();render();toast('原文件已更新，现有学习进度已保留');}catch(e){toast(e.message);}}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();$('#dropzone').classList.add('dragover');}});
document.addEventListener('dragleave',e=>{if(e.target.closest('#dropzone'))$('#dropzone').classList.remove('dragover');});
document.addEventListener('drop',async e=>{if(e.target.closest('#dropzone')){e.preventDefault();await addFiles([...e.dataTransfer.files]);}});
document.addEventListener('keydown',e=>{if(!modalType)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const els=$$('button:not(:disabled),input:not([type=file]),select,textarea,a[href]', $('.modal')).filter(el=>el.offsetParent!==null);if(!els.length)return;const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
setInterval(()=>{const next=dateKey();if(next!==TODAY){const wasToday=selectedDay===TODAY;TODAY=next;if(wasToday){selectedDay=TODAY;weekAnchor=TODAY;}render();if(modalType)closeModal();toast('新的一天，今日任务已更新');}},30000);
window.addEventListener('storage',e=>{if(e.key==='yiji-v2'&&e.newValue){try{const updated=JSON.parse(e.newValue);if(updated.version===2){state=updated;if(modalType)closeModal();render();toast('学习记录已与另一个标签页同步');}}catch{}}});
render();

})();
